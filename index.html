<!doctype html>
<html lang="zh-CN" data-theme="light" data-font="song">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>账页 · 记账工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='9' fill='%239BEBB6' stroke='%2317130F' stroke-width='2.4'/%3E%3Cpath d='M10 23V18.4M16 23V14M22 23V10.6' stroke='%2317130F' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.6 6h.01M3.6 12h.01M3.6 18h.01"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15.5l4-5 3 3 5.5-7"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18"/></symbol>
  <symbol id="i-arrows" viewBox="0 0 24 24"><path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M11 3l1.7 4.9L17.6 9.6l-4.9 1.7L11 16.2 9.3 11.3 4.4 9.6l4.9-1.7z"/><path d="M18 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v2.3M12 19.1v2.3M4.4 7.1l2 1.1M17.6 15.8l2 1.1M4.4 16.9l2-1.1M17.6 8.2l2-1.1"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 12.5h9L17.5 7"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4.5 19.5h15"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9M7.5 13.5L12 9l4.5 4.5M4.5 4.5h15"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.4 6.5M20 5v6h-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.6 4.6L19 6.6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.4l8.6 15.2h-17.2z"/><path d="M12 10v4.4M12 17.4v.01"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.2"/><path d="M9.5 4v16"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5.6A1.6 1.6 0 0 0 13.4 4H5.6A1.6 1.6 0 0 0 4 5.6v7.8A1.6 1.6 0 0 0 5.6 15"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5l3 3"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 16.5z"/><path d="M4 8.5V7a2 2 0 0 1 2-2h9"/><path d="M15 12.5h5"/></symbol>
</svg>

<div class="app">
  <div class="book">
    <header class="book-head" id="topbar">
      <div class="head-brand">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
            <rect x="1.7" y="1.7" width="36.6" height="36.6" rx="11" style="fill:var(--mint)" stroke="currentColor" stroke-width="2.6"/>
            <path d="M12 28.5V22.8M20 28.5V17.2M28 28.5V13" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
            <circle cx="28" cy="8.6" r="2.4" style="fill:var(--coral)" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <div class="brand-text">
            <strong>账页</strong>
            <span>LEDGER</span>
          </div>
        </div>
      </div>

      <nav class="tabs" id="nav">
        <button class="nav-item" data-act="nav" data-view="dashboard"><svg class="icon"><use href="#i-grid"/></svg><span>仪表盘</span></button>
        <button class="nav-item" data-act="nav" data-view="txns"><svg class="icon"><use href="#i-list"/></svg><span>明细</span></button>
        <button class="nav-item" data-act="nav" data-view="stats"><svg class="icon"><use href="#i-chart"/></svg><span>统计</span></button>
        <button class="nav-item" data-act="nav" data-view="budget"><svg class="icon"><use href="#i-target"/></svg><span>预算</span></button>
        <button class="nav-item" data-act="nav" data-view="accounts"><svg class="icon"><use href="#i-card"/></svg><span>账户</span></button>
        <button class="nav-item" data-act="nav" data-view="debts"><svg class="icon"><use href="#i-arrows"/></svg><span>负债</span></button>
        <button class="nav-item" data-act="nav" data-view="ai"><svg class="icon"><use href="#i-spark"/></svg><span>AI 分析</span></button>
        <button class="nav-item" data-act="nav" data-view="settings"><svg class="icon"><use href="#i-gear"/></svg><span>设置</span></button>
      </nav>

      <div class="head-tools">
        <div class="book-pick" title="切换账本">
          <svg class="icon"><use href="#i-book"/></svg>
          <select id="bookSelect" class="book-select" aria-label="切换账本"></select>
        </div>
        <div class="month-nav">
          <button class="icon-btn" data-act="month" data-dir="-1" aria-label="上一月"><svg class="icon"><use href="#i-chev-l"/></svg></button>
          <button class="month-label" data-act="month" data-dir="0" id="monthLabel">—</button>
          <button class="icon-btn" data-act="month" data-dir="1" aria-label="下一月"><svg class="icon"><use href="#i-chev-r"/></svg></button>
          <button class="ghost-btn" data-act="month" data-dir="now">本月</button>
        </div>
        <button class="icon-btn" data-act="theme" aria-label="切换主题" id="themeBtn"><svg class="icon"><use href="#i-moon"/></svg></button>
        <button class="primary-btn" data-act="add-txn" title="快捷键 N"><svg class="icon"><use href="#i-plus"/></svg><span>记一笔</span></button>
      </div>
    </header>

    <main class="page" id="page">
      <div class="view" id="view"></div>
    </main>

    <footer class="book-foot">
      <button class="flip" id="flipPrev" data-act="flip" data-dir="-1" aria-label="上一页">
        <svg class="icon"><use href="#i-chev-l"/></svg><span class="flip-name">上一页</span>
      </button>
      <div class="foot-mid"><b id="pageNo">01</b> / 08 · <span id="pageName">仪表盘</span></div>
      <button class="flip" id="flipNext" data-act="flip" data-dir="1" aria-label="下一页">
        <span class="flip-name">下一页</span><svg class="icon"><use href="#i-chev-r"/></svg>
      </button>
    </footer>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="app.js" defer></script>
</body>
</html>
